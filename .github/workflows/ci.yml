name: ci

on:
  pull_request:
  push:
    # Pushes to master are tested by the release workflow, which calls this one.
    branches-ignore:
      - master
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #       Check-out repo
      #----------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      #----------------------------------------------
      #       Install Java and Gradle
      #----------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      #----------------------------------------------
      #       Build and test
      #----------------------------------------------
      - name: Build, check formatting and run unit tests
        run: ./gradlew build
      - name: Run GameTests
        run: ./gradlew runGameTestServer
