name: pr-title

# PRs are squash-merged with their title as the commit message, and semantic-release picks the
# version from that message, so the title must follow Conventional Commits.
on:
  # pull_request_target runs with the workflow from master and never checks out the PR's code.
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with the release rules in release.config.cjs.
          types: |
            feat
            fix
            perf
            revert
            refactor
            build
            docs
            style
            test
            ci
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" must start with a lowercase letter,
            for example "feat: add comparator output".
